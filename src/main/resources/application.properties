spring.application.name=order-api

aws.region=us-east-1

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
server.port=8080

# Kafka Configuration
spring.kafka.bootstrap-servers=***REDACTED_KAFKA_ENDPOINT***

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=***REDACTED_KAFKA_ENDPOINT***
spring.kafka.consumer.group-id=order-api-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=true

# Make Kafka connection failures non-blocking for health checks
management.health.kafka.enabled=false

# Google Maps API Configuration
# API key stored in AWS Secrets Manager: prod/google-maps-api-key
# For local development, set GOOGLE_MAPS_API_KEY environment variable
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
