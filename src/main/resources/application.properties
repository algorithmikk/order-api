spring.application.name=order-api

aws.region=us-east-1

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
server.port=8080

# Per-endpoint latency inventory: http.server.requests is tagged by templated URI,
# so every endpoint is measured without a synthetic test per route.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,5s
management.metrics.tags.application=${spring.application.name}

# CloudWatch export is opt-in: histogram buckets become billable custom metrics.
# The latency inventory reads /actuator/prometheus instead, which costs nothing.
management.cloudwatch.metrics.export.namespace=UmaMeats/order-api
management.cloudwatch.metrics.export.enabled=${CLOUDWATCH_METRICS_ENABLED:false}
management.cloudwatch.metrics.export.step=1m

# Kafka Configuration
# Broker address is injected via env var KAFKA_BOOTSTRAP_SERVERS in ECS;
# defaults to localhost for local development.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Consumer Configuration
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=order-api-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=true

# Make Kafka connection failures non-blocking for health checks
management.health.kafka.enabled=false

# Google Maps API Configuration
# API key stored in AWS Secrets Manager: prod/google-maps-api-key
# For local development, set GOOGLE_MAPS_API_KEY environment variable
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Twilio WhatsApp Content Template SID (injected via env var in ECS)
twilio.content-template-sid=${TWILIO_CONTENT_TEMPLATE_SID:}

# Logging Configuration - Silence Kafka completely (no connection retry spam when Kafka is down)
logging.level.root=WARN
logging.level.com.umameats=INFO
logging.level.org.springframework.kafka=OFF
logging.level.org.apache.kafka=OFF

# Phase C: Tomcat virtual threads (Boot 3.2+ / 4.x)
spring.threads.virtual.enabled=true
