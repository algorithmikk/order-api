name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: order-api
  ECS_SERVICE: order-api
  ECS_CLUSTER: umameats-api
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: order-api

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and tag image
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Pre-deploy actuator health
      env:
        IMAGE: ${{ steps.build-image.outputs.image }}
        AWS_REGION: ${{ env.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        set -euo pipefail
        docker run -d --name predeploy-health -p 8080:8080 \
          -e AWS_REGION \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          "$IMAGE"
        cleanup() { docker rm -f predeploy-health >/dev/null 2>&1 || true; }
        trap cleanup EXIT
        for i in $(seq 1 45); do
          if body=$(curl -sf --max-time 3 http://127.0.0.1:8080/actuator/health); then
            if echo "$body" | grep -q UP; then
              echo "OK: $body"
              exit 0
            fi
          fi
          sleep 2
        done
        echo "=== docker logs ==="
        docker logs predeploy-health || true
        echo "error: actuator health did not become UP within 90s" >&2
        exit 1

    - name: Push image to Amazon ECR
      env:
        IMAGE: ${{ steps.build-image.outputs.image }}
      run: docker push "$IMAGE"

    - name: Substitute environment placeholders in task definition
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
        TWILIO_CONTENT_TEMPLATE_SID: ${{ secrets.TWILIO_CONTENT_TEMPLATE_SID }}
      run: |
        envsubst < ${{ env.ECS_TASK_DEFINITION }} > .aws/task-definition.rendered.json
        mv .aws/task-definition.rendered.json ${{ env.ECS_TASK_DEFINITION }}

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: Post-deploy ALB smoke
      run: |
        set -euo pipefail
        VERSION=8.0.1
        curl --location --remote-name \
          "https://github.com/Orange-OpenSource/hurl/releases/download/${VERSION}/hurl_${VERSION}_amd64.deb"
        sudo apt-get update
        sudo apt-get install -y "./hurl_${VERSION}_amd64.deb"
        hurl --version
        hurl --test --variable "BASE_URL=https://api.umameats.com" src/test/api-smoke/*.hurl
